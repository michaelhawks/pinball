<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Wild Kratts Spinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
    Deliberately single-theme: this recreates a physical game-night gadget
    (a fixed-color plastic disc under an expedition-console bezel), so the
    palette is committed rather than swapped for light/dark hosts.
  */
  :root {
    --ink-deep: #0a1826;
    --ink-panel: #123049;
    --ink-panel-hi: #1c4568;
    --line-ink: #0e1f2f;
    --disc-light: #dcebf5;
    --disc-base: #aecbdf;
    --disc-shadow: #7ba0c0;
    --card-edge: #cfe0ee;
    --gold: #f5c151;
    --gold-edge: #c98f2c;
    --ember: #ff6b35;
    --ember-deep: #c1330f;
    --mist: #eaf3fb;
    --mist-dim: #9db6cc;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: radial-gradient(circle at 50% 15%, #163a58 0%, var(--ink-deep) 55%, #061019 100%);
    color: var(--mist);
    font-family: "Nunito", "Segoe UI", sans-serif;
  }
  body {
    display: flex;
    justify-content: center;
    padding: clamp(20px, 4vh, 40px) 16px 40px;
  }
  .stage {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .stage-head {
    text-align: center;
    margin-bottom: 20px;
  }
  h1 {
    margin: 0 0 6px;
    font-family: "Baloo 2", "Nunito", sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 6vw, 38px);
    letter-spacing: 0.5px;
    color: var(--mist);
    text-shadow: 0 3px 0 #04101c;
    text-wrap: balance;
  }
  .subtitle {
    margin: 0;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.4px;
    color: var(--mist-dim);
  }
  .console-panel {
    position: relative;
    width: 100%;
    background: linear-gradient(180deg, var(--ink-panel-hi) 0%, var(--ink-panel) 12%, var(--ink-panel) 100%);
    border-radius: 28px;
    padding: 26px 22px 22px;
    box-shadow:
      0 18px 40px rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.08),
      inset 0 -6px 14px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .rivet {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #cfe0ee, #6d88a1 70%, #33455a 100%);
    box-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .rivet.tl { top: 14px; left: 14px; }
  .rivet.tr { top: 14px; right: 14px; }
  .rivet.bl { bottom: 14px; left: 14px; }
  .rivet.br { bottom: 14px; right: 14px; }

  .wheel-wrap {
    position: relative;
    width: min(78vw, 340px);
    height: min(78vw, 340px);
  }
  .wheel-glow {
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,193,81,0.35) 0%, rgba(245,193,81,0) 68%);
    animation: breathe 4.5s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { opacity: 0.55; transform: scale(0.96); }
    50% { opacity: 1; transform: scale(1.03); }
  }
  .wheel-wrap svg#wheelSvg {
    position: relative;
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.5));
  }
  .needle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14%;
    height: 46%;
    transform-origin: 50% 100%;
    transform: translate(-50%, -100%) rotate(0deg);
    pointer-events: none;
  }
  .needle svg { width: 100%; height: 100%; overflow: visible; }
  .needle.spinning {
    transition: transform 4200ms cubic-bezier(0.12, 0.67, 0.1, 1);
  }
  .hub-cap {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 9%;
    height: 9%;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8dc, var(--gold-edge) 70%, #7a5915 100%);
    border: 2px solid #4a3608;
    box-shadow: 0 2px 6px rgba(0,0,0,0.6);
    pointer-events: none;
  }

  #spinBtn {
    font-family: "Baloo 2", sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #fff8ee;
    background: linear-gradient(180deg, var(--ember) 0%, var(--ember-deep) 70%);
    border: 3px solid #ffdcc4;
    border-radius: 999px;
    padding: 14px 52px;
    cursor: pointer;
    box-shadow: 0 6px 0 #7a1f08, 0 10px 18px rgba(0,0,0,0.4);
    transition: transform 80ms ease, box-shadow 80ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  #spinBtn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #7a1f08, 0 6px 12px rgba(0,0,0,0.4);
  }
  #spinBtn:disabled { opacity: 0.6; cursor: default; }
  #spinBtn:focus-visible {
    outline: 3px solid var(--gold);
    outline-offset: 3px;
  }

  .result {
    min-height: 68px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .result .num {
    font-family: "Baloo 2", sans-serif;
    font-size: 46px;
    font-weight: 800;
    color: var(--gold);
    text-shadow: 0 0 12px rgba(245,193,81,0.55), 2px 2px 0 #04101c;
    min-height: 54px;
    line-height: 1;
  }
  .result .label {
    font-size: 13px;
    font-weight: 700;
    opacity: 0.85;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--mist-dim);
  }

  .history-strip {
    width: 100%;
    padding-top: 16px;
    border-top: 1px solid rgba(255,255,255,0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .history-label {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--mist-dim);
  }
  .history {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .history span {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 28px;
    height: 28px;
    padding: 0 4px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    font-family: "Nunito", sans-serif;
    font-size: 13px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--mist);
  }
  .history span.word {
    min-width: auto;
    padding: 0 10px;
    border-radius: 14px;
    color: var(--gold);
  }

  @media (prefers-reduced-motion: reduce) {
    .wheel-glow { animation: none; opacity: 0.75; }
    .needle.spinning { transition-duration: 900ms; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="stage-head">
      <h1>Wild Kratts Spinner</h1>
      <p class="subtitle">Tap SPIN to flick the arrow</p>
    </div>

    <div class="console-panel">
      <span class="rivet tl"></span>
      <span class="rivet tr"></span>
      <span class="rivet bl"></span>
      <span class="rivet br"></span>

      <div class="wheel-wrap">
        <div class="wheel-glow"></div>
        <svg id="wheelSvg" viewBox="0 0 400 400"></svg>
        <div class="needle" id="needle">
          <svg viewBox="0 0 60 220" preserveAspectRatio="xMidYMax meet">
            <polygon points="30,0 46,60 14,60" fill="#ff6b35" stroke="#4a0e02" stroke-width="3" stroke-linejoin="round"/>
            <rect x="20" y="55" width="20" height="150" rx="6" fill="#f2f2f2" stroke="#4a0e02" stroke-width="3"/>
            <rect x="24" y="58" width="12" height="140" rx="4" fill="#ffb08a" opacity="0.6"/>
          </svg>
        </div>
        <div class="hub-cap"></div>
      </div>

      <button id="spinBtn" type="button">SPIN</button>

      <div class="result">
        <div class="num" id="resultNum"></div>
        <div class="label" id="resultLabel"></div>
      </div>

      <div class="history-strip">
        <div class="history-label">Recent spins</div>
        <div class="history" id="history"></div>
      </div>
    </div>
  </div>

<script>
(function () {
  const CX = 200, CY = 200, R = 190;
  const SEGMENTS = 7;
  const SEGMENT_DEG = 360 / SEGMENTS;
  // Boundary at 0deg (12 o'clock) sits between numbers 2 and 3, matching
  // the physical card: clockwise order from 12 o'clock is 3,4,5,6,SWIPE,1,2.
  const ORDER = [3, 4, 5, 6, "SWIPE", 1, 2];

  // deg here uses 0 = 12 o'clock, clockwise positive. Convert to standard
  // math angle (0 = 3 o'clock, counter-clockwise) for trig, then place.
  function pointOnCircle(cx, cy, r, degFrom12) {
    const rad = (degFrom12 - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }

  function segmentCenterAngle(index) {
    // index 0..6 -> boundary at index*SEGMENT_DEG, center at +half a wedge
    return index * SEGMENT_DEG + SEGMENT_DEG / 2;
  }

  function readableRotation(deg) {
    let d = ((deg + 180) % 360 + 360) % 360 - 180; // normalize -180..180
    if (d > 90) d -= 180;
    if (d < -90) d += 180;
    return d;
  }

  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("wheelSvg");

  function el(tag, attrs) {
    const e = document.createElementNS(svgNS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }

  // Defs: gradients
  const defs = el("defs", {});
  const bgGrad = el("radialGradient", { id: "discGrad", cx: "50%", cy: "45%", r: "70%" });
  bgGrad.appendChild(el("stop", { offset: "0%", "stop-color": "#dcebf5" }));
  bgGrad.appendChild(el("stop", { offset: "55%", "stop-color": "#aecbdf" }));
  bgGrad.appendChild(el("stop", { offset: "100%", "stop-color": "#7ba0c0" }));
  defs.appendChild(bgGrad);
  svg.appendChild(defs);

  // Outer card + disc
  svg.appendChild(el("rect", { x: 4, y: 4, width: 392, height: 392, rx: 26, fill: "#cfe0ee", stroke: "#0e1f2f", "stroke-width": 6 }));
  svg.appendChild(el("circle", { cx: CX, cy: CY, r: R, fill: "url(#discGrad)", stroke: "#0e1f2f", "stroke-width": 6 }));

  // Segment divider lines
  for (let i = 0; i < SEGMENTS; i++) {
    const p = pointOnCircle(CX, CY, R, i * SEGMENT_DEG);
    svg.appendChild(el("line", { x1: CX, y1: CY, x2: p.x, y2: p.y, stroke: "#0e1f2f", "stroke-width": 5, "stroke-linecap": "round" }));
  }

  // Lightning bolts radiating from the hub, one per segment
  function boltPath(centerDeg) {
    const jag = [0, 10, -8, 14, -6, 18];
    let d = `M ${CX} ${CY} `;
    let r = 20;
    for (let i = 1; i < jag.length; i++) {
      r += 26;
      const p = pointOnCircle(CX, CY, r, centerDeg + jag[i] * 0.6);
      d += `L ${p.x.toFixed(1)} ${p.y.toFixed(1)} `;
    }
    return d;
  }
  for (let i = 0; i < SEGMENTS; i++) {
    const centerDeg = segmentCenterAngle(i);
    const d = boltPath(centerDeg);
    svg.appendChild(el("path", {
      d, fill: "none", stroke: "#fff6d8", "stroke-width": 5,
      "stroke-linejoin": "round", "stroke-linecap": "round", opacity: 0.9
    }));
    // literal hex (not var()) — keeps SVG presentation attributes reliable in Safari
    svg.appendChild(el("path", {
      d, fill: "none", stroke: "#c98f2c", "stroke-width": 2,
      "stroke-linejoin": "round", "stroke-linecap": "round"
    }));
  }

  // Numbers + the SWIPE wedge label
  for (let i = 0; i < SEGMENTS; i++) {
    const centerDeg = segmentCenterAngle(i);
    const value = ORDER[i];
    const isWord = typeof value === "string";
    const pos = pointOnCircle(CX, CY, isWord ? 150 : 122, centerDeg);
    const rot = readableRotation(centerDeg);
    const g = el("g", { transform: `translate(${pos.x.toFixed(1)},${pos.y.toFixed(1)}) rotate(${rot.toFixed(1)})` });
    const text = el("text", {
      "text-anchor": "middle",
      "dominant-baseline": "middle",
      "font-family": "'Baloo 2', 'Arial Black', sans-serif",
      "font-size": isWord ? "27" : "54",
      "font-weight": "800",
      "letter-spacing": isWord ? "-0.5" : "0",
      fill: isWord ? "#fff2c4" : "#f5ecd8",
      stroke: "#0e1f2f",
      "stroke-width": isWord ? "3.5" : "5",
      "paint-order": "stroke fill"
    });
    text.textContent = isWord ? value : String(value);
    g.appendChild(text);
    svg.appendChild(g);
  }

  // Hub ring
  svg.appendChild(el("circle", { cx: CX, cy: CY, r: 14, fill: "#0e1f2f" }));
  svg.appendChild(el("circle", { cx: CX, cy: CY, r: 7, fill: "#fff6d8" }));

  // --- Spin logic ---
  const needle = document.getElementById("needle");
  const spinBtn = document.getElementById("spinBtn");
  const resultNum = document.getElementById("resultNum");
  const resultLabel = document.getElementById("resultLabel");
  const historyEl = document.getElementById("history");

  let currentRotation = 0;
  let spinning = false;
  const history = [];

  function playTone(freq, duration, type, delay) {
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      if (!playTone._ctx) playTone._ctx = new AudioCtx();
      const ctx = playTone._ctx;
      const t0 = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(0.15, t0 + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration + 0.02);
    } catch (e) { /* audio unavailable, ignore */ }
  }

  function updateHistory(value) {
    history.unshift(value);
    if (history.length > 10) history.pop();
    historyEl.innerHTML = "";
    history.forEach((v) => {
      const s = document.createElement("span");
      const isWord = typeof v === "string";
      s.textContent = isWord ? "SW" : v;
      if (isWord) s.classList.add("word");
      historyEl.appendChild(s);
    });
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultLabel.textContent = "";
    resultNum.textContent = "";

    const winningIndex = Math.floor(Math.random() * SEGMENTS);
    const winningValue = ORDER[winningIndex];
    const isWord = typeof winningValue === "string";
    const segCenter = segmentCenterAngle(winningIndex);
    // land somewhere inside the segment, away from the dividing lines
    const jitter = (Math.random() - 0.5) * (SEGMENT_DEG - 10);
    const targetWithinTurn = segCenter + jitter;

    const extraTurns = 6 + Math.floor(Math.random() * 3); // 6-8 full spins
    const currentMod = ((currentRotation % 360) + 360) % 360;
    let delta = targetWithinTurn - currentMod;
    delta = ((delta % 360) + 360) % 360; // 0..360 forward delta
    const finalRotation = currentRotation + extraTurns * 360 + delta;

    needle.classList.add("spinning");
    needle.style.transform = `translate(-50%, -100%) rotate(${finalRotation}deg)`;
    currentRotation = finalRotation;

    playTone(440, 0.08, "square", 0);

    window.setTimeout(() => {
      needle.classList.remove("spinning");
      spinning = false;
      spinBtn.disabled = false;
      resultNum.textContent = winningValue;
      resultLabel.textContent = isWord ? "SWIPE! Spin again" : "You spun a " + winningValue + "!";
      updateHistory(winningValue);
      playTone(660, 0.25, "triangle", 0);
      playTone(880, 0.35, "triangle", 0.08);
    }, 4300);
  }

  spinBtn.addEventListener("click", spin);
})();
</script>
</body>
</html>
